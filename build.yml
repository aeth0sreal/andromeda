name: Build Andromeda

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: Android64
            os: ubuntu-latest
            target: Android64
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: andromeda-${{ matrix.config.name }}
          path: ./build/*.geode
